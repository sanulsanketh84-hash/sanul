<p>Whale Shark
Habitat: Tropical oceans worldwide.
<br>
<br>
Diet: Plankton, small fish, and squid (filter-feeder).
<br>
<br>
Special Feature: Largest fish in the world, reaching up to 19 m.
<br>
<br>
Behavior: Gentle giant; migrates long distances.
<br>
<br>
