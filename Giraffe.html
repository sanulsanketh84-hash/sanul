<h1>Giraffe</h1>

<p>Giraffe
Habitat: African savannahs and woodlands.
<br>
<br>
Diet: Leaves, especially acacia trees.
<br>
<br>
Special Feature: Tallest land animal; long neck helps reach high foliage.
<br>
<br>
Behavior: Social groups called “towers”; males fight by “necking.”
<br>
<br>
Threats: Poaching and habitat loss.</p>
